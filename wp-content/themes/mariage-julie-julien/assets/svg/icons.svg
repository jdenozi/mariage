<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

    <!-- Alliances - Ceremonie -->
    <symbol id="icon-rings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="12" r="5"/>
        <circle cx="15" cy="12" r="5"/>
    </symbol>

    <!-- Verres - Vin d'honneur -->
    <symbol id="icon-glasses" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 22h8"/>
        <path d="M12 17v5"/>
        <path d="M17 2l-5 5-5-5"/>
        <path d="M4 7h16"/>
        <path d="M6 7c0 2.5 2.5 5 6 5s6-2.5 6-5"/>
        <path d="M12 12v5"/>
    </symbol>

    <!-- Champagne - Alternative -->
    <symbol id="icon-champagne" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 22h8"/>
        <path d="M12 17v5"/>
        <path d="M7 2h10l-2 9a4 4 0 01-3 3 4 4 0 01-3-3L7 2z"/>
        <circle cx="16" cy="5" r="1"/>
        <circle cx="14" cy="3" r="0.5"/>
    </symbol>

    <!-- Assiette & couverts - Diner -->
    <symbol id="icon-dinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8"/>
        <circle cx="12" cy="12" r="5"/>
        <line x1="3" y1="12" x2="4" y2="12"/>
        <line x1="20" y1="12" x2="21" y2="12"/>
    </symbol>

    <!-- Couverts simples -->
    <symbol id="icon-cutlery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Fourchette -->
        <path d="M6 2v6c0 1.1.9 2 2 2h0a2 2 0 002-2V2"/>
        <path d="M8 2v8"/>
        <path d="M8 10v12"/>
        <!-- Couteau -->
        <path d="M18 2c0 0-2 2-2 6s2 4 2 4v10"/>
    </symbol>

    <!-- Note de musique - Soiree -->
    <symbol id="icon-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
    </symbol>

    <!-- Coeur - Ceremonie alternative -->
    <symbol id="icon-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
    </symbol>

    <!-- Eglise/Lieu - Ceremonie -->
    <symbol id="icon-church" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v4"/>
        <path d="M10 4h4"/>
        <path d="M5 22V10l7-4 7 4v12"/>
        <path d="M9 22v-6h6v6"/>
    </symbol>

    <!-- Eucalyptus/Branche - Decoration -->
    <symbol id="icon-branch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22c0-8 0-12 0-20"/>
        <ellipse cx="8" cy="7" rx="3" ry="2" transform="rotate(-30 8 7)"/>
        <ellipse cx="16" cy="9" rx="3" ry="2" transform="rotate(30 16 9)"/>
        <ellipse cx="7" cy="13" rx="3" ry="2" transform="rotate(-30 7 13)"/>
        <ellipse cx="17" cy="15" rx="3" ry="2" transform="rotate(30 17 15)"/>
    </symbol>

    <!-- Lune -->
    <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
    </symbol>

    <!-- Etoile -->
    <symbol id="icon-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7L12 16.4 5.7 21l2.3-7L2 9.4h7.6L12 2z"/>
    </symbol>

    <!-- Petite etoile/sparkle -->
    <symbol id="icon-sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/>
    </symbol>

</svg>
